name: 화훼 경매 품목 수집
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국시간 06:00
  workflow_dispatch:         # 수동 실행 버튼

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-market.mjs
        env:
          AT_SERVICE_KEY: ${{ secrets.AT_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add market.json ai-tags.json
          git diff --staged --quiet || git commit -m "경매 품목 갱신"
          git push
